[arrangement]
name = "PacBio_16S_forward"
kit  = "PB16S"

# Forward primer from pacbio document: 5'-GCATC-[BC1 16nt]-AGRGTTYGATYMTGGCTCAG-3'
mask1_front = "GCATC"
mask1_rear  = "AGRGTTYGATYMTGGCTCAG"

# Barcode sequences
barcode1_pattern = "FWD%02i"
first_index = 1
last_index  = 8

[scoring]
max_barcode_penalty = 11
min_barcode_penalty_dist = 3
min_separation_only_dist = 6
barcode_end_proximity = 75
#recomendations from ont docs, in the range of 5-10 bases is typically good
flank_left_pad = 5
flank_right_pad = 10
front_barcode_window = 175
rear_barcode_window = 175
midstrand_flank_score = 0.95